<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>七鲜 · 邀好友集金卡</title><style>
*{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0;background:#29231c;font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{position:relative;width:100%;max-width:480px;margin:auto;aspect-ratio:1125/2436;overflow:hidden}img{display:block;width:100%;height:auto;pointer-events:none}.action{position:absolute;top:80.8%;width:18%;height:10%;border:0;background:transparent;padding:0;cursor:pointer;border-radius:20px;-webkit-tap-highlight-color:transparent}.action:focus-visible,.cancel:focus-visible{outline:2px solid #ff7200;outline-offset:2px}.wechat{left:3%}.moments{left:22%}.qq{left:41%}.save{left:60%}.link{left:79%}.cancel{position:absolute;left:35%;top:92%;width:30%;height:5%;border:0;background:transparent;cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}dialog{width:min(85vw,330px);border:0;border-radius:20px;padding:24px;color:#713411;background:#fffaf0;text-align:center}dialog::backdrop{background:#0006}dialog p{font-size:16px;line-height:1.7}dialog button{border:0;border-radius:22px;background:#ff8c28;color:white;padding:10px 28px;font-size:16px;cursor:pointer}
</style></head><body><main aria-label="分享活动"><img src="assets/media/5492adf972617dec90c7.png" alt="七鲜邀请好友集金卡分享页" width="1125" height="2436"><button class="action wechat" aria-label="分享到微信" data-channel="微信"></button><button class="action moments" aria-label="分享到朋友圈" data-channel="朋友圈"></button><button class="action qq" aria-label="分享到QQ" data-channel="QQ"></button><a class="action save" href="assets/media/5492adf972617dec90c7.png" download="七鲜分享图片.png" aria-label="保存图片"></a><button class="action link" aria-label="生成链接" id="share-link"></button><a class="cancel" href="index.html" aria-label="取消分享，返回主会场"></a></main><dialog id="notice" aria-label="分享提示"><p id="message"></p><form method="dialog"><button>知道了</button></form></dialog><script>
function inform(message){document.getElementById('message').textContent=message;document.getElementById('notice').showModal()}
document.querySelectorAll('[data-channel]').forEach(button=>button.addEventListener('click',()=>inform('请先保存海报，再在'+button.dataset.channel+'中选择图片分享。')));
document.getElementById('share-link').addEventListener('click',()=>inform('当前为本地预览，尚未配置可分享的线上活动链接。可先保存海报。'));
</script></body></html>
