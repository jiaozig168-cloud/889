<dialog id="notice" aria-labelledby="notice-title" aria-describedby="notice-message"><h2 id="notice-title"></h2><p id="notice-message"></p><form method="dialog"><button>知道了</button></form></dialog>
<script>
  const notice=document.getElementById('notice');
  const checkinTrigger=document.querySelector('[data-action="checkin"]');
  const names=['樱桃','浓巧','鲜果','甜点','秋味'];
  let chances=4,collected=0,checked=false;
  try{const stored=sessionStorage.getItem('qixian-draw-chances');if(stored!==null)chances=Math.max(0,Math.min(4,Number(stored)||0))}catch{}
  function show(title,message){document.getElementById('notice-title').textContent=title;document.getElementById('notice-message').textContent=message;notice.showModal()}
  function update(){const label=document.getElementById('remaining');label.textContent=`剩余 ${chances} 次`;document.querySelector('[data-action="draw"]').setAttribute('aria-label',`抢好礼，剩余${chances}次`)}
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.info){show(button.dataset.info,button.dataset.message);return}
    switch(button.dataset.action){
      case 'top':window.scrollTo({top:0});break;
      case 'share':openShare();break;
      case 'invite':openInvite();break;
      case 'game':openGame();break;
      case 'shop':openShop();break;
      case 'tasks':openTasks();break;
      case 'browse':show('选购好物','这是页面演示，尚未接入商品和下单服务。');break;
      case 'draw':
        if(collected>=5){show('美食卡已集齐','点击合成按钮，体验合成金卡。');break}
        if(!chances){show('机会已用完','可以通过每日签到增加一次体验机会。');break}
        chances--;try{sessionStorage.setItem('qixian-draw-chances',String(chances))}catch{}update();openDraw();break;
      case 'combine':show(collected===5?'合成成功 · 演示':'美食卡还未集齐',collected===5?'五张美食卡已合成金卡！此为交互演示，不会发放真实券包。':`已收集 ${collected}/5 张卡，点击抢好礼继续收集。`);break;
    }
  });
  checkinTrigger.addEventListener('click',event=>{event.stopPropagation();openCheckin()});
  update();
  notice.addEventListener('click',event=>{if(event.target===notice){const rect=notice.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)notice.close()}});
</script>

function toggleReminder(button){
 const enabled=button.getAttribute('aria-checked')!=='true';
 button.setAttribute('aria-checked',String(enabled));
 document.getElementById('reminder-status').textContent=enabled?'签到提醒已开启':'签到提醒已关闭';
 try{localStorage.setItem('qixian-checkin-reminder',String(enabled))}catch{}
}
try{if(localStorage.getItem('qixian-checkin-reminder')==='false')document.querySelector('.reminder-switch').setAttribute('aria-checked','false')}catch{}

function claimCheckin(){
 const tile=document.getElementById('claimed-day');
 tile.removeAttribute('hidden');
 document.getElementById('day-count').removeAttribute('hidden');
 const button=document.querySelector('.sign');
 button.setAttribute('aria-label','今日已签到');
 button.disabled=true;
 document.getElementById('claim-status').textContent='签到成功，已连续打卡2天，第二天奖励15已领取。';
}

const checkinModal=document.getElementById('checkin-modal');
let checkinCloseTimer;
function alignCheckin(){const r=document.querySelector('main').getBoundingClientRect();checkinModal.style.left=r.left+'px';checkinModal.style.width=r.width+'px'}
window.addEventListener('resize',()=>{if(checkinModal.open)alignCheckin()});
function openCheckin(){
 clearTimeout(checkinCloseTimer);
 document.body.style.overflow='hidden';
 alignCheckin();
 checkinModal.showModal();
 requestAnimationFrame(()=>requestAnimationFrame(()=>checkinModal.classList.add('is-open')));
}
function closeCheckin(){
 checkinModal.classList.remove('is-open');
 checkinCloseTimer=setTimeout(()=>{checkinModal.close();document.body.style.overflow=''},240);
}
checkinModal.querySelector('.close').addEventListener('click',event=>{event.preventDefault();closeCheckin()});
checkinModal.addEventListener('cancel',event=>{event.preventDefault();closeCheckin()});
</script>

#game-screen{display:block;position:fixed;z-index:1000;top:0;left:0;width:375px;max-width:100vw;height:min(812px,100dvh);background:transparent;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transform:translate3d(0,8px,0);transition:opacity .2s ease,transform .24s cubic-bezier(.22,.61,.36,1),visibility 0s linear .24s;will-change:opacity,transform;contain:strict;box-shadow:0 0 0 100vmax #f5f5f5}
#game-screen.is-open{opacity:1;visibility:visible;pointer-events:auto;transform:translate3d(0,0,0);transition-delay:0s}

<section id="game-screen" role="dialog" aria-modal="true" aria-hidden="true" aria-label="蛋糕投投乐"><iframe title="蛋糕投投乐 V048" src="toutoule-v048.html" loading="eager"></iframe></section>
<script>
const gameScreen=document.getElementById('game-screen');let gameCloseTimer;
function alignGame(){const r=document.querySelector('main').getBoundingClientRect();const width=Math.ceil(r.right)-Math.floor(r.left),height=Math.min(812,window.innerHeight);gameScreen.style.left=Math.floor(r.left)+'px';gameScreen.style.width=width+'px';gameScreen.style.height=height+'px';gameScreen.style.top=Math.max(0,Math.floor((window.innerHeight-height)/2))+'px'}
function openGame(){clearTimeout(gameCloseTimer);alignGame();document.body.style.overflow='hidden';gameScreen.setAttribute('aria-hidden','false');requestAnimationFrame(()=>gameScreen.classList.add('is-open'))}
function closeGame(){gameScreen.classList.remove('is-open');gameScreen.setAttribute('aria-hidden','true');gameCloseTimer=setTimeout(()=>{document.body.style.overflow=''},240)}
alignGame();window.addEventListener('resize',alignGame);
window.addEventListener('message',event=>{if(event.source===gameScreen.querySelector('iframe').contentWindow&&event.data?.type==='qixian-close-game')closeGame()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&gameScreen.classList.contains('is-open'))closeGame()});
</script>
