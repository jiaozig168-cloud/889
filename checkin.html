<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>七鲜 · 每日签到</title><style>
*{box-sizing:border-box}body{margin:0;background:#29231c;font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{position:relative;width:100%;max-width:480px;margin:auto}img{display:block;width:100%;height:auto}.hotspot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.hotspot:hover,.hotspot:active{background:transparent}.hotspot:focus-visible{outline:2px solid white;outline-offset:3px}.sign{left:28.5%;top:59.63%;width:43%;height:6.82%;border-radius:999px}.close{left:45%;top:73.94%;width:10%;height:4.02%;border-radius:50%}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}dialog{width:min(85vw,330px);border:0;border-radius:20px;padding:24px;color:#713411;background:#fff9ed;text-align:center}dialog::backdrop{background:#0005}dialog p{font-size:16px;line-height:1.7}dialog button{border:0;border-radius:20px;padding:10px 28px;background:#ff8c28;color:white;font-size:16px;cursor:pointer}
.claimed-day{position:absolute;left:33.066667%;top:39.29%;width:16%;height:auto;pointer-events:none}.claimed-day[hidden]{display:none}
.reminder-switch{position:absolute;left:78.133333%;top:34.31%;width:7.2%;height:4.31%;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.reminder-track{position:absolute;left:0;top:30%;width:100%;height:40%;border-radius:999px;background:#ff7100;transition:background-color .24s ease}.reminder-knob{position:absolute;top:7%;left:4%;width:44%;height:86%;border-radius:50%;background:white;transform:translateX(109.09%);transition:transform .24s cubic-bezier(.22,.61,.36,1)}.reminder-switch[aria-checked="false"] .reminder-track{background:#aaa}.reminder-switch[aria-checked="false"] .reminder-knob{transform:translateX(0)}.reminder-switch:focus-visible{outline:2px solid #713411;outline-offset:2px;border-radius:8px}
.day-count{position:absolute;left:31.2%;top:35.35%;width:3.55555556%;height:auto;pointer-events:none}.day-count[hidden]{display:none}</style></head><body><main aria-label="七鲜签到弹窗页"><img src="assets/media/55ba14d00a5932ee0eeb.png" alt="累计签到7天，必得20元优惠券。已连续打卡1天。第1天已领取10，第2天待领取15，第3天抽卡次数，第4天25，第5天35，第6天45，第7天60和优惠券。" width="1125" height="2436"><button class="hotspot sign" aria-label="立即签到" onclick="claimCheckin()"></button><a class="hotspot close" href="index.html" aria-label="关闭签到弹窗，返回主会场"></a><svg id="claimed-day" class="claimed-day" viewBox="0 0 180 210" hidden aria-label="第二天已领取，奖励15"><svg viewBox="165 0 180 210" width="180" height="210"><image href="assets/media/b35ebee44893efebd405.png" width="1125" height="444"/></svg><rect x="42" y="166" width="96" height="35" fill="#fff8e5"/><text x="90" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#a67850">+15</text><g aria-hidden="true"><circle cx="132" cy="147" r="27" fill="#ffcc00"/><path d="M121 147 L129 155 L144 139" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></svg><p class="sr-only" id="claim-status" role="status"></p><button class="reminder-switch" type="button" role="switch" aria-checked="true" aria-label="签到提醒" onclick="toggleReminder(this)"><span class="reminder-track"><span class="reminder-knob"></span></span></button><span class="sr-only" id="reminder-status" role="status"></span><svg id="day-count" class="day-count" viewBox="0 0 40 55" hidden aria-label="已连续打卡2天"><defs><linearGradient id="count-bg" x2="0" y2="1"><stop stop-color="#feedae"/><stop offset="1" stop-color="#fef1b9"/></linearGradient></defs><rect width="40" height="55" fill="url(#count-bg)"/><text x="14.5" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ff6100">2</text></svg></main><dialog id="notice" aria-label="签到提示"><p>当前为演示页面，暂未接入签到服务。</p><form method="dialog"><button>知道了</button></form></dialog><script>
function toggleReminder(button){
 const enabled=button.getAttribute('aria-checked')!=='true';
 button.setAttribute('aria-checked',String(enabled));
 document.getElementById('reminder-status').textContent=enabled?'签到提醒已开启':'签到提醒已关闭';
 try{localStorage.setItem('qixian-checkin-reminder',String(enabled))}catch{}
}
try{if(localStorage.getItem('qixian-checkin-reminder')==='false')document.querySelector('.reminder-switch').setAttribute('aria-checked','false')}catch{}

function claimCheckin(){
 const tile=document.getElementById('claimed-day');
 tile.removeAttribute('hidden');
 document.getElementById('day-count').removeAttribute('hidden');
 const button=document.querySelector('.sign');
 button.setAttribute('aria-label','今日已签到');
 button.disabled=true;
 document.getElementById('claim-status').textContent='签到成功，已连续打卡2天，第二天奖励15已领取。';
}
</script></body></html>
